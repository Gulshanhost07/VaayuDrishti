[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vaayudrishti"
version = "1.0.0"
description = "National Weather Big Data Analytics Platform - backend (SIH26069)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "aiokafka>=0.11",
  "redis>=5.0",
  "minio>=7.2",
  "opensearch-py>=2.4,<3",
  "httpx>=0.27",
  "apscheduler>=3.10",
  "feedparser>=6.0",
  "langdetect>=1.0.9",
  "PyJWT>=2.9",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "email-validator>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "datasketch>=1.6",
  "joblib>=1.4",
  "pandas>=2.2",
  "python-dateutil>=2.9",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0",
  "transformers>=4.44",
  "torch>=2.3",
]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "types-feedparser",
  "pandas-stubs",
]

[tool.setuptools.packages.find]
include = ["shared*", "api*", "ingest*", "pipeline*", "ml*"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = ["B008", "BLE001"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["migrations", "tests"]

[[tool.mypy.overrides]]
module = ["datasketch.*", "feedparser.*", "langdetect.*", "minio.*", "opensearch_py.*", "aiokafka.*", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["shared.schemas"]
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = ["pipeline.dedup"]
disable_error_code = ["str-bytes-safe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
